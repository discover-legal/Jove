name: LegalEyes
options:
  bundleIdPrefix: legal.discover
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: LegalEyes/Config/Base.xcconfig
  Release: LegalEyes/Config/Base.xcconfig
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.9.0"
targets:
  LegalEyes:
    type: application
    platform: iOS
    sources:
      - path: LegalEyes
        excludes: ["Config/*.example", "Info.plist"]
    settings:
      base:
        INFOPLIST_FILE: LegalEyes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    preBuildScripts: []
  LegalEyesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LegalEyesTests]
    dependencies:
      - target: LegalEyes
schemes:
  LegalEyes:
    build:
      targets:
        LegalEyes: all
        LegalEyesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LegalEyesTests]
