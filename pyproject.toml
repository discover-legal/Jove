[project]
name = "jove"
version = "0.1.0"
description = "Place chunks of scanned pages into a data schema; emit JSONL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "rapidocr>=3.9",
]
jev = [
    "typesafe-sdk>=0.7.2",
]
docling = [
    "docling>=2.132.0",
]
laya = [
    "laya>=0.3.23",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "pypdf>=6.19.0",
    "pytest>=8",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
