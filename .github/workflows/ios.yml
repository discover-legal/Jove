name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode on runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install iOS simulator runtime
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; \
              ds=[x for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]]; \
              ds.sort(key=lambda x:x["name"]); print(ds[-1]["udid"] if ds else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -i iphone | tail -3

      - name: Build (Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project LegalEyes.xcodeproj \
            -scheme LegalEyes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project LegalEyes.xcodeproj \
            -scheme LegalEyes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
